[package]
name = "alx-core"
description = "alx agent loop, pluggable traits and built-in implementations."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alx-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
github-copilot-sdk = { workspace = true, optional = true }

[features]
default = ["copilot"]
# GitHub Copilot as a provider (via the Copilot SDK and the `copilot` CLI).
copilot = ["dep:github-copilot-sdk"]
