[package]
name = "alx-cli"
description = "alx interactive CLI: a line-based REPL on top of alx-core."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "alx"
path = "src/main.rs"

[dependencies]
alx-core.workspace = true
alx-acp.workspace = true
agent-client-protocol = { workspace = true, features = ["stdio"] }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
rustyline = { version = "14", default-features = false }
terminal_size = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
