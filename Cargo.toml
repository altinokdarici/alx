[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
alx-protocol = { path = "crates/alx-protocol" }
alx-core = { path = "crates/alx-core" }
alx-acp = { path = "crates/alx-acp" }
agent-client-protocol = "3.4"
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }
# No `bundled-cli`: alx runs the `copilot` CLI the user already has installed
# instead of embedding one. `runtime` (needed to spawn the CLI) would still
# download a copy at build time; `.cargo/config.toml` turns that off.
github-copilot-sdk = { version = "1.0.22", default-features = false, features = ["runtime"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
toml = "0.8"
tokio-util = "0.7"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
